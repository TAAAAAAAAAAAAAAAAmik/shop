services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kinetix
      POSTGRES_PASSWORD: kinetix
      POSTGRES_DB: kinetix
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinetix"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
